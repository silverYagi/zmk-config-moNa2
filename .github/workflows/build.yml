on: [push, pull_request, workflow_dispatch]

jobs:
  compatibility-check:
    name: 旧動作IDの互換性を検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 設定を保持した番号の読み替えを検証
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -DCONFIG_MONA2_LEGACY_BEHAVIOR_ID_LIMIT=8 -Itests/compat/stubs compat/legacy_behavior_ids.c tests/compat/behavior_registry.c tests/compat/legacy_behavior_ids_test.c -Wl,--wrap=zmk_behavior_find_behavior_name_from_local_id -o /tmp/mona2-legacy-ids-test
          /tmp/mona2-legacy-ids-test
  build:
    needs: compatibility-check
    # Zephyr 4.1のボード定義に対応するワークフローを固定する。
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
