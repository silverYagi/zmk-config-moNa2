# DYAの診断・ランタイム編集機能に対応する左右セット。
include:
  - board: xiao_ble/nrf52840/zmk
    shield: moNa2_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DEXTRA_CONF_FILE="../../config/dya-diagnostics-common.conf;../../config/pmw3360.conf;../../config/bluetooth-passkey.conf;../../config/bluetooth-radio-latency.conf" -DEXTRA_DTC_OVERLAY_FILE=../../config/pmw3360.overlay'
    artifact-name: mona2-right-pmw3360-dya-features
  - board: xiao_ble/nrf52840/zmk
    shield: moNa2_L rgbled_adapter
    cmake-args: '-DEXTRA_CONF_FILE=../../config/dya-diagnostics-common.conf'
    artifact-name: mona2-left-dya-features
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: mona2-settings-reset-dya-features
