# パスキー認証の比較版と、動作確認済みのPMW3360版を生成する。
include:
  - board: seeeduino_xiao_ble
    shield: moNa2_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DEXTRA_CONF_FILE="../../config/pmw3360.conf;../../config/bluetooth-passkey.conf" -DEXTRA_DTC_OVERLAY_FILE=../../config/pmw3360.overlay'
    artifact-name: mona2-right-keyball39-dya-pmw3360-passkey
  - board: seeeduino_xiao_ble
    shield: moNa2_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DEXTRA_CONF_FILE=../../config/pmw3360.conf -DEXTRA_DTC_OVERLAY_FILE=../../config/pmw3360.overlay'
    artifact-name: mona2-right-keyball39-dya-pmw3360-test
  - board: seeeduino_xiao_ble
    shield: moNa2_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: mona2-right-keyball39-dya-keyboard-only
  - board: seeeduino_xiao_ble
    shield: moNa2_L rgbled_adapter
    artifact-name: mona2-left-keyball39-dya
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: mona2-settings-reset-dya
